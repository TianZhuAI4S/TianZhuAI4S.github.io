<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="mx-2 my-1">
                    <h6 class="plain-list-title">Honors & Awards</h6>
                    <ul class="plain-list">
                        {% for item in site.data.profile.awards %}
                        <li>
                            <div>{{ item.name }}</div>
                            <div class="plain-list-date">{{ item.date }}</div>
                        </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
